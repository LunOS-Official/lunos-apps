name: Validate and update LunOS App Catalog

on:
  push:
    paths:
      - 'packages/**/*.ln'
      - 'packages/*.ln'
      - 'tools/**'
      - '.github/workflows/validate-packages.yml'
  pull_request:
    paths:
      - 'packages/**/*.ln'
      - 'packages/*.ln'
      - 'tools/**'
      - '.github/workflows/validate-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: validate-packages-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify repository identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/verify_github_token.py

      - name: Validate LN packages and build catalog
        run: python3 tools/validate_packages.py

      - name: Commit generated catalog
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          git config user.name "lunos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repository/index.json
          git diff --cached --quiet || git commit -m "chore: update package catalog"

          BRANCH="${GITHUB_REF#refs/heads/}"

          git fetch origin "$BRANCH"
          if ! git rebase --autostash "origin/$BRANCH"; then
            git rebase --abort || true
            git merge --no-edit "origin/$BRANCH" || true
          fi

          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded"
              break
            fi
            echo "Push failed, attempt $i. Refetching and rebasing before retry..."
            sleep $((i * 2))
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH" || true
            if [ "$i" -eq 3 ]; then
              echo "Final push failed after retries"
              exit 1
            fi
          done
